apiVersion: v1
kind: Namespace
metadata:
  name: lab
---
apiVersion: v1
kind: Pod
metadata:
  name: oom-demo
  namespace: lab
spec:
  containers:
  - name: hog
    image: busybox:1.36
    command: ["sh", "-c", "echo start; sleep 5; tail /dev/zero"]
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 32Mi}
