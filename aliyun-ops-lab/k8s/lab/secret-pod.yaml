apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
  namespace: lab
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD
      volumeMounts:
        - name: secret-vol
          mountPath: /etc/secret
          readOnly: true
      resources:
        requests: {cpu: 10m, memory: 8Mi}
        limits: {cpu: 50m, memory: 16Mi}
  volumes:
    - name: secret-vol
      secret:
        secretName: app-secret
