- name: node-exporter container up (docker compose)
  command: docker compose up -d node-exporter
  args:
    chdir: /home/zjy/monitoring
  register: ne_up
  changed_when: >-
    'Created' in ne_up.stderr or
    'Recreated' in ne_up.stderr or
    'Started' in ne_up.stderr

- name: node-exporter metrics reachable
  uri:
    url: http://127.0.0.1:9100/metrics
    status_code: 200
    return_content: false
  check_mode: false
  register: ne_metrics
  retries: 5
  delay: 3
  until: ne_metrics.status == 200
