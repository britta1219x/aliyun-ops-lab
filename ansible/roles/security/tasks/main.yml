- name: Install fail2ban
  apt:
    name: fail2ban
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: sshd hardening drop-in
  copy:
    src: 00-hardening.conf
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload sshd

- name: Validate sshd config
  command: sshd -t
  changed_when: false
  check_mode: false

- name: fail2ban jail.local
  copy:
    src: jail.local
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: fail2ban enabled and running
  systemd:
    name: fail2ban
    enabled: true
    state: started
